<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - CodeNexa</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">CodeNexa</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarMenu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="index.html">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="dashboard.html">Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="signup.html">Sign Up</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<section class="container py-5">

    <div class="form-container">

        <h2 class="text-center mb-4">Employee Sign Up</h2>

        <form action="dashboard.html">

            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" required minlength="6">
            </div>

            <div class="mb-3">
                <label class="form-label">Employee Type</label>

                <select class="form-select" required>
                    <option value="">Select Employee Type</option>
                    <option>Permanent Employee</option>
                    <option>Contract Employee</option>
                    <option>Temporary Employee</option>
                    <option>Intern</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Department</label>

                <select class="form-select" required>
                    <option value="">Select Department</option>
                    <option>Development</option>
                    <option>Design</option>
                    <option>Marketing</option>
                    <option>Human Resources</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Joining Date</label>
                <input type="date" class="form-control" required>
            </div>

            <button type="submit" class="btn btn-primary w-100">
                Create Account
            </button>

        </form>

    </div>

</section>

<footer class="bg-dark text-white">
    <div class="container py-4">

        <div class="row">

            <div class="col-md-4">
                <h5>CodeNexa Technologies</h5>

            </div>

                <a href="dashboard.html">Dashboard</a><br>
                <a href="signup.html">Sign Up</a>
            </div>

            <div class="col-md-4">
                <h5>Contact</h5>
                <p>info@codenexa.com</p>
                <p>+92 300 1234567</p>
                <p>Karachi, Pakistan</p>
            </div>

        </div>

        <hr>

        <p class="text-center mb-0">
            © 2026 CodeNexa Technologies. All Rights Reserved.
        </p>

    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
